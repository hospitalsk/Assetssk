<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <title>ระบบบริหารจัดการครุภัณฑ์และคลังวัสดุโรงพยาบาล</title>
    <script>
      // GitHub Pages SPA redirect
      (function() {
        var pathSegments = window.location.pathname.split('/');
        var repoName = pathSegments[1] || '';
        var search = window.location.search;
        var hash = window.location.hash;
        if (repoName) {
          window.location.replace('/' + repoName + '/' + search + hash);
        } else {
          window.location.replace('/' + search + hash);
        }
      })();
    </script>
  </head>
  <body>
    <div style="font-family: sans-serif; text-align: center; padding: 50px;">
      กำลังโหลดระบบ...
    </div>
  </body>
</html>
